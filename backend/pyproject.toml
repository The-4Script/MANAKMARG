[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manakmarg"
version = "0.1.0"
description = "MANAK MARG - evidence-first BIS standards and compliance navigator (SIH 2026, PS26107 prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "joblib>=1.3",
]

[project.optional-dependencies]
llm = ["anthropic", "groq"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
manakmarg = "manakmarg.__main__:main"

[tool.setuptools.packages.find]
include = ["manakmarg*"]

[tool.setuptools.package-data]
manakmarg = ["search/*.json", "reasoning/*.json", "demo/samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["."]
